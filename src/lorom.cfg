# ld65 config for a 32KB LoROM SNES image.
#
# LoROM maps bank $00:$8000-$FFFF to ROM $0000-$7FFF, so a single 32KB bank is
# enough for M1's display-only ROM (code + 4KB tiles + 2KB tilemap + 32B CGRAM).
# Output is a headerless .sfc.

MEMORY {
    # Work RAM. Bank $7E's first 8KB is mirrored into $0000-$1FFF of bank $00,
    # so direct page and stack live here.
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    RAM:      start = $0100, size = $1F00, type = rw;

    # ROM: everything up to the cartridge header.
    ROM:      start = $8000, size = $7FB0, type = ro, file = %O, fill = yes, fillval = $FF;

    # $FFB0-$FFDF cartridge header, $FFE0-$FFFF native/emulation vectors.
    HEADER:   start = $FFB0, size = $0030, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE:    load = ROM,     type = ro,  start = $8000;
    RODATA:  load = ROM,     type = ro,  align = $100;
    SNESHDR: load = HEADER,  type = ro;
    VECTORS: load = VECTORS, type = ro;
    BSS:     load = RAM,     type = bss;
}
