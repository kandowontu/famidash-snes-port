# ld65 config for a 256KB LoROM SNES image (8 banks).
#
# bank $00        code, tiles, CGRAM, cartridge header, vectors
# banks $01-$04   level column stream (1796 columns x 64 bytes, bank-aligned)
# banks $05-$07   padding to a power-of-two ROM size
#
# ld65 emits memory areas to the output file in declaration order, so this
# listing is also the ROM's physical layout.

MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    RAM:      start = $0100, size = $1F00, type = rw;

    # --- bank $00 ---
    ROM0:     start = $8000, size = $7FB0, type = ro, file = %O, fill = yes, fillval = $FF;
    HEADER:   start = $FFB0, size = $0030, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;

    # --- banks $01-$04: column data ---
    COL0:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    COL1:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    COL2:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    COL3:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;

    # --- banks $05-$07: pad to 256KB ---
    PAD0:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    PAD1:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    PAD2:     start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZEROPAGE, type = bss;
    CODE:     load = ROM0,    type = ro, start = $8000;
    RODATA:   load = ROM0,    type = ro, align = $100;
    SNESHDR:  load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;

    COLBANK0: load = COL0,    type = ro, start = $8000;
    COLBANK1: load = COL1,    type = ro, start = $8000;
    COLBANK2: load = COL2,    type = ro, start = $8000;
    COLBANK3: load = COL3,    type = ro, start = $8000;

    BSS:      load = RAM,     type = bss;
}
